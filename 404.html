<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Lauren Studios — Yearbook Proof</title>
<script>
  // Short links like myseniorportraitproof.com/CODE land here; send them to the proof page with the code.
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '').replace(/[^A-Fa-f0-9]/g, '').slice(0, 64);
    location.replace('/' + (p ? '?t=' + p : ''));
  })();
</script>
</head>

</html>
