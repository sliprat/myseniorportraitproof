<title>Lauren Studios — Yearbook Proof</title>
<script>
  // Forwards myseniorportraitproof.com/?t=CODE (or /CODE) to the proof page, keeping the student's code.
  (function () {
    var PAGE = 'https://script.google.com/macros/s/AKfycbzNzko5cnKEFn-qn0cd7UygloQALr6SI3RC4ZQtw1LBbSfi5zc0sJ2Ljhga4gWaCmEztg/exec';
    var q = new URLSearchParams(location.search);
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    if (p.indexOf('.') >= 0) p = '';
    var t = (q.get('t') || p).replace(/[^A-Fa-f0-9]/g, '').slice(0, 64);
    var id = (q.get('id') || '').replace(/[^A-Za-z0-9-]/g, '');
    var url = PAGE + (t ? '?t=' + t : (id ? '?id=' + encodeURIComponent(id) : ''));
    location.replace(url);
  })();
</script>
